<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TimeBalance/title>

    <!-- Browser Icon -->
    <link rel="icon" type="image/png" href="icon-192.png">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">

    <!-- iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Überstunden">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>TimeBalance</h1>

    <div class="card">

        <h2>Tages-Eintrag</h2>

        <label>Datum</label>
        <input type="date" id="datum">

        <label>Kommen</label>
        <input type="time" id="kommen">

        <label>Gehen</label>
        <input type="time" id="gehen">

        <label>Pause in Minuten</label>
        <input type="number" id="pause" value="30">

        <label>Sollzeit in Stunden</label>
        <input type="number" id="sollzeit" step="0.01" value="6">

        <label>Bemerkung</label>
        <input
            type="text"
            id="bemerkung"
            placeholder="z.B. länger gearbeitet"
        >

        <button
            id="speichernButton"
            onclick="speichern()"
        >
            Speichern
        </button>

    </div>

    <div class="card">

        <h2>Monats-Nachtrag</h2>

        <label>Monat</label>
        <input type="month" id="nachtragMonat">

        <label>Überstunden (hh:mm)</label>
        <input
            type="text"
            id="nachtragZeit"
            placeholder="z.B. 08:15 oder -02:30"
        >

        <label>Bemerkung</label>
        <input
            type="text"
            id="nachtragBemerkung"
            placeholder="z.B. Nachtrag Mai"
        >

        <button onclick="monatsNachtragSpeichern()">
            Nachtrag speichern
        </button>

    </div>

    <h2>
        Gesamtsaldo:
        <span id="saldo">0h 0min</span>
    </h2>

    <h2>Monatsübersicht</h2>
    <div id="monatsuebersicht"></div>

    <h2>Einträge</h2>
    <div id="liste"></div>

    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then(() => console.log('Service Worker registriert'))
                .catch(err => console.log(err));
        }
    </script>

</body>
</html>
